# Render Blueprint: FastAPI backend + managed Postgres.
# The frontend is deployed separately on Vercel (see README → Deployment).
services:
  - type: web
    name: leadflow-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # Seeding is a no-op once the database has leads.
    startCommand: python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: leadflow-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false # set to your Vercel URL, e.g. https://leadflow-yourname.vercel.app

databases:
  - name: leadflow-db
    plan: free
    databaseName: leadflow
    user: leadflow
